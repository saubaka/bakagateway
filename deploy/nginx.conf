server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 3m;
    error_page 413 = @request_too_large;
    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    # Containers may receive a new IP after recreation; do not cache api's
    # address for the entire lifetime of the Nginx worker.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    include /etc/nginx/gateway-security-headers.conf;

    location ~ ^/(api|oauth|\.well-known)(/|$) {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, never append the incoming client-supplied forwarding header.
        # The API is internal only and trusts exactly this single proxy hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 504 = @api_unavailable;
        error_page 413 = @request_too_large;
    }
    location @api_unavailable {
        default_type application/json;
        include /etc/nginx/gateway-security-headers.conf;
        add_header Cache-Control no-store always;
        add_header X-Request-ID $request_id always;
        return 503 '{"ok":false,"error":{"code":"database_unavailable","message":"服务暂时不可用，请稍后重试。"},"requestId":"$request_id"}';
    }
    location @request_too_large {
        default_type application/json;
        include /etc/nginx/gateway-security-headers.conf;
        add_header Cache-Control no-store always;
        add_header X-Request-ID $request_id always;
        return 413 '{"ok":false,"error":{"code":"request_too_large","message":"请求内容过大，请缩小文件后重试。"},"requestId":"$request_id"}';
    }
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/gateway-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/gateway-security-headers.conf;
        add_header Cache-Control no-store;
    }
}
