[project]
name = "bakagateway"
version = "1.15.0"
description = "bakagateway (baka网关): a local-first cute OAuth2 and OpenID Connect login gateway."
requires-python = ">=3.12,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "wheelhouse", "instance", "migrations", "bakagit"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
